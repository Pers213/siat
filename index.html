<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приглашение</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #fdf2f8 0%, #ede9fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #3d3d4e;
    }

    .card {
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 26px;
      margin-bottom: 18px;
      color: #7c3aed;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
      color: #5b5b6e;
    }

    .question {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #3d3d4e;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option {
      padding: 16px 20px;
      border-radius: 16px;
      border: 2px solid #e9e4f8;
      background: #faf9ff;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: left;
      font-family: inherit;
      color: #3d3d4e;
      width: 100%;
    }

    .option:hover {
      border-color: #c4b5fd;
      background: #f3efff;
      transform: translateY(-2px);
    }

    .option.selected {
      border-color: #7c3aed;
      background: #f3efff;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.15);
    }

    .confirm {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: #7c3aed;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.25s ease;
      display: none;
    }

    .confirm:hover {
      background: #6d28d9;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
      background: #f0fdf4;
      color: #166534;
      font-size: 16px;
      line-height: 1.5;
      display: none;
      animation: fadeIn 0.5s ease;
    }

    .heart {
      font-size: 22px;
      margin-bottom: 12px;
      display: block;
    }

    @media (max-width: 420px) {
      .card { padding: 30px 20px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="heart">💜</span>
    <h1>Привет!</h1>
    <p class="subtitle">
      Мы ещё ни разу не виделись, и мне бы очень хотелось это исправить.
      Давай встретимся?
    </p>

    <p class="question">Куда пойдём?</p>

    <div class="options" id="options">
      <button class="option" data-place="в уютную кофейню">☕ Кофейня</button>
      <button class="option" data-place="в парк на прогулку">🌳 Парк</button>
      <button class="option" data-place="в музей или галерею">🎨 Музей / галерея</button>
      <button class="option" data-place="на набережную">🌊 Набережная</button>
    </div>

    <button class="confirm" id="confirm">Готово ✓</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    const options = document.querySelectorAll('.option');
    const confirmBtn = document.getElementById('confirm');
    const resultBox = document.getElementById('result');
    let selected = null;

    options.forEach(btn => {
      btn.addEventListener('click', () => {
        options.forEach(o => o.classList.remove('selected'));
        btn.classList.add('selected');
        selected = btn.dataset.place;
        confirmBtn.style.display = 'block';
        resultBox.style.display = 'none';
      });
    });

    confirmBtn.addEventListener('click', () => {
      if (!selected) return;
      resultBox.innerHTML = `Отличный выбор! Идём ${selected}. 🎉<br>Напиши мне, когда тебе удобно — и я всё организую.`;
      resultBox.style.display = 'block';
      confirmBtn.style.display = 'none';
    });
  </script>

</body>
</html>
